<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoO Strategies | ToT Fight Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <p class="eyebrow">Siege of Orgrimmar</p>
          <h1>Raid Strategies</h1>
          <p class="lede">Rendered from <code>SoO Strats.md</code> in this repo.</p>
          <p class="hint"><a href="index.html">Back to Fight Analysis Dashboard</a></p>
        </div>
        <div class="hero-panel">
          <p class="hint" style="margin: 0">
            Tip: edit <code>SoO Strats.md</code> and refresh this page.
          </p>
        </div>
      </header>

      <main>
        <section class="card">
          <h2>SoO Strats</h2>
          <div id="content" class="prose">
            <p class="note">Loading…</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
      const contentEl = document.getElementById("content");

      marked.setOptions({
        gfm: true,
        breaks: false,
      });

      async function load() {
        try {
          const res = await fetch("SoO%20Strats.md", { cache: "no-store" });
          if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
          const md = await res.text();
          const html = marked.parse(md);
          contentEl.innerHTML = DOMPurify.sanitize(html);
          applyBossCollapsibles(contentEl);
        } catch (err) {
          contentEl.innerHTML = `<p class="note">Could not load <code>SoO Strats.md</code>. ${String(err)}</p>`;
        }
      }

      function applyBossCollapsibles(root) {
        // Treat Markdown `##` headings as boss sections.
        // Keep the page usable by letting you collapse each boss.
        const h2s = Array.from(root.querySelectorAll("h2"));
        if (!h2s.length) return;

        for (let i = 0; i < h2s.length; i++) {
          const h2 = h2s[i];
          const details = document.createElement("details");
          details.className = "boss";
          // Open the first boss by default.
          if (i === 0) details.open = true;

          const summary = document.createElement("summary");
          const title = h2.textContent || "Section";
          const titleSpan = document.createElement("span");
          titleSpan.className = "boss-title";
          titleSpan.textContent = title;
          summary.appendChild(titleSpan);
          details.appendChild(summary);

          const body = document.createElement("div");
          body.className = "boss-body";

          // Move everything after the h2 into this details until the next h2.
          let node = h2.nextSibling;
          while (node && !(node.nodeType === 1 && node.tagName === "H2")) {
            const next = node.nextSibling;
            body.appendChild(node);
            node = next;
          }

          const heroicCount = markHeroicContent(body);
          if (heroicCount > 0) {
            details.classList.add("heroic-off");
            const toggle = createHeroicToggle(title, details);
            summary.appendChild(toggle);
          }

          details.appendChild(body);
          h2.replaceWith(details);
        }
      }

      function createHeroicToggle(title, detailsEl) {
        const wrap = document.createElement("span");
        wrap.className = "heroic-toggle";

        const id = `heroic-toggle-${slug(title)}-${Math.random().toString(16).slice(2)}`;
        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = id;
        input.checked = false;

        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = "Heroic";

        // Avoid toggling the <details> open/closed when interacting with the checkbox.
        for (const el of [wrap, input, label]) {
          el.addEventListener("click", (e) => e.stopPropagation());
          el.addEventListener("pointerdown", (e) => e.stopPropagation());
        }

        input.addEventListener("change", () => {
          detailsEl.classList.toggle("heroic-off", !input.checked);
        });

        wrap.appendChild(input);
        wrap.appendChild(label);
        return wrap;
      }

      function slug(text) {
        return String(text || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 40);
      }

      function markHeroicContent(root) {
        const heroicPrefix = /^\s*heroic\b\s*[:\-]?/i;
        let count = 0;

        // 1) Wrap sections that are explicitly labeled as "Heroic" headings.
        const headings = Array.from(root.querySelectorAll("h3, h4, h5, h6"));
        for (const h of headings) {
          if (!heroicPrefix.test(h.textContent || "")) continue;
          if (h.closest(".heroic-only")) continue;

          const level = Number(h.tagName.slice(1));
          const wrapper = document.createElement("div");
          wrapper.className = "heroic-only";
          h.parentNode.insertBefore(wrapper, h);

          let node = h;
          while (node) {
            const next = node.nextSibling;
            if (node.nodeType === 1) {
              const tag = node.tagName;
              const isHeading = /^H[3-6]$/.test(tag);
              if (isHeading) {
                const nextLevel = Number(tag.slice(1));
                if (node !== h && nextLevel <= level) break;
              }
            }
            wrapper.appendChild(node);
            node = next;
          }

          count += 1;
        }

        // 2) Hide individual lines that start with "Heroic:" (common inline callouts).
        const lineEls = Array.from(root.querySelectorAll("li, p"));
        for (const el of lineEls) {
          if (el.closest(".heroic-only")) continue;
          const text = (el.textContent || "").trim();
          if (!heroicPrefix.test(text)) continue;
          el.classList.add("heroic-only");
          count += 1;
        }

        return count;
      }

      load();
    </script>
  </body>
</html>
