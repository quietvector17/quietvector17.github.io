<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoO Strategies (Archived Single File) | ToT Fight Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <p class="eyebrow">Siege of Orgrimmar</p>
          <h1>Raid Strategies (Archived)</h1>
          <p class="lede">Rendered from <code>SoO Strats.md</code> in this repo.</p>
          <p class="hint">
            <a href="../index.html">Back to Fight Analysis Dashboard</a>
            · <a href="../soo-strats.html">Go to current strats page</a>
          </p>
        </div>
        <div class="hero-panel">
          <div class="version-tag">
            <span class="label">Strats Version</span>
            <span class="value" id="strats-version">v?</span>
          </div>
          <p class="hint" style="margin: 12px 0 0">Archived single-file version.</p>
        </div>
      </header>

      <main>
        <section class="card">
          <h2>SoO Strats</h2>
          <div id="content" class="prose">
            <p class="note">Loading...</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
      const contentEl = document.getElementById("content");

      const VERSION_PATH = "../strats/soo/VERSION";

      marked.setOptions({
        gfm: true,
        breaks: false,
      });

      async function loadVersion() {
        const el = document.getElementById("strats-version");
        if (!el) return;
        try {
          const res = await fetch(VERSION_PATH, { cache: "no-store" });
          if (!res.ok) return;
          const raw = (await res.text()).trim();
          if (!raw) return;
          el.textContent = `v${raw}`;
        } catch {
          // ignore
        }
      }

      async function load() {
        try {
          const res = await fetch("../SoO%20Strats.md", { cache: "no-store" });
          if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
          const md = await res.text();
          const html = marked.parse(md);
          contentEl.innerHTML = DOMPurify.sanitize(html);
          applyBossCollapsibles(contentEl);
        } catch (err) {
          contentEl.innerHTML = `<p class="note">Could not load <code>SoO Strats.md</code>. ${String(err)}</p>`;
        }
      }

      function applyBossCollapsibles(root) {
        // Treat Markdown `##` headings as boss sections.
        // Keep the page usable by letting you collapse each boss.
        const h2s = Array.from(root.querySelectorAll("h2"));
        if (!h2s.length) return;

        const storageKey = `strats:bossOpen:${location.pathname}`;
        const savedOpen = loadOpenSet(storageKey);
        const hasSaved = savedOpen != null;
        const openSet = savedOpen || new Set();

        for (let i = 0; i < h2s.length; i++) {
          const h2 = h2s[i];
          const details = document.createElement("details");
          details.className = "boss";
          const title = (h2.textContent || "Section").trim();
          const key = bossKey(title);

          // Restore open state if available; otherwise open the first section.
          if (hasSaved) details.open = openSet.has(key);
          else if (i === 0) details.open = true;

          const summary = document.createElement("summary");
          const titleSpan = document.createElement("span");
          titleSpan.className = "boss-title";
          titleSpan.textContent = title;
          summary.appendChild(titleSpan);
          details.appendChild(summary);

          const body = document.createElement("div");
          body.className = "boss-body";

          // Move everything after the h2 into this details until the next h2.
          let node = h2.nextSibling;
          while (node && !(node.nodeType === 1 && node.tagName === "H2")) {
            const next = node.nextSibling;
            body.appendChild(node);
            node = next;
          }

          decorateHeroicMarkers(body);
          embedYouTubeLinks(body);
          decorateGuildCallouts(body);
          decorateGuildAssignmentsLayout(body);

          details.appendChild(body);
          h2.replaceWith(details);

          details.addEventListener("toggle", () => {
            try {
              const cur = loadOpenSet(storageKey) || new Set();
              if (details.open) cur.add(key);
              else cur.delete(key);
              localStorage.setItem(storageKey, JSON.stringify(Array.from(cur)));
            } catch {
              // Ignore storage failures (privacy mode, etc.).
            }
          });
        }
      }

      function bossKey(title) {
        // Case-insensitive key; keep it stable across minor formatting.
        return title.trim().toLowerCase();
      }

      function loadOpenSet(storageKey) {
        try {
          const raw = localStorage.getItem(storageKey);
          if (!raw) return null;
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return null;
          return new Set(arr.map((s) => String(s)));
        } catch {
          return null;
        }
      }

      function embedYouTubeLinks(root) {
        // DOMPurify will strip iframes if they come from Markdown HTML.
        // Instead, we create safe iframes programmatically for YouTube links.
        const links = Array.from(root.querySelectorAll('a[href^="https://youtu.be/"], a[href^="https://www.youtube.com/"]'));
        for (const a of links) {
          const href = a.getAttribute("href") || "";
          const info = parseYouTubeUrl(href);
          if (!info) continue;

          // Only auto-embed links that look like intentional "path" references.
          const container = a.closest("li, p");
          const contextText = ((container && container.textContent) || "").toLowerCase();
          if (!contextText.includes("path")) continue;

          // Avoid duplicating embeds if the content is reprocessed.
          if (container && container.querySelector(":scope > .video-embed")) continue;

          const wrap = document.createElement("div");
          wrap.className = "video-embed";

          const inner = document.createElement("div");
          inner.className = "video-embed-inner";

          const iframe = document.createElement("iframe");
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "strict-origin-when-cross-origin";

          const params = new URLSearchParams();
          params.set("rel", "0");
          params.set("modestbranding", "1");
          if (info.startSeconds) params.set("start", String(info.startSeconds));
          iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(info.videoId)}?${params.toString()}`;

          inner.appendChild(iframe);
          wrap.appendChild(inner);

          // Insert just after the link's container.
          if (container && container.parentNode) {
            container.parentNode.insertBefore(wrap, container.nextSibling);
          } else {
            root.appendChild(wrap);
          }
        }
      }

      function decorateGuildCallouts(root) {
        // Style specific guild-critical reminders as loud callouts.
        const mustSyncTurrets = "YOU MUST SHOOT THE BOSS WITH THE TURRETS AT THE SAME TIME TO BRING IT DOWN";
        const nodes = Array.from(root.querySelectorAll("p, li"));
        for (const el of nodes) {
          const raw = (el.textContent || "");
          const normalized = raw
            .replace(/\*/g, "")
            .replace(/\s+/g, " ")
            .trim();
          if (normalized !== mustSyncTurrets) continue;

          // If Markdown didn't parse the emphasis and left literal `***`,
          // replace the text at render-time (don't modify the source .md).
          if (raw.includes("*")) {
            el.textContent = mustSyncTurrets;
          }

          el.classList.add("callout-danger");
        }
      }

      function decorateGuildAssignmentsLayout(root) {
        // Make the South/North tower labels read like subheads and reduce the
        // list indentation under them.
        const targets = new Set(["South Tower (Tower 1)", "North Tower (Tower 2)"]);
        const ps = Array.from(root.querySelectorAll("p"));
        for (const p of ps) {
          const title = (p.textContent || "").replace(/\s+/g, " ").trim();
          if (!targets.has(title)) continue;
          if (!isUnderTurretClickers(p)) continue;

          p.classList.add("guild-subhead");
          const next = p.nextElementSibling;
          if (next && next.tagName === "UL") {
            next.classList.add("guild-sublist");
          }
        }
      }

      function isUnderTurretClickers(el) {
        // Ensure we only touch the "Turret Clickers" area.
        let cur = el.previousElementSibling;
        while (cur) {
          if (cur.tagName === "H4" || cur.tagName === "H3" || cur.tagName === "H2") {
            const t = (cur.textContent || "").toLowerCase();
            return t.includes("turret clickers");
          }
          cur = cur.previousElementSibling;
        }
        return false;
      }

      function parseYouTubeUrl(url) {
        try {
          const u = new URL(url);
          if (u.hostname === "youtu.be") {
            const videoId = u.pathname.replace(/^\//, "").split("/")[0];
            if (!videoId) return null;
            const startSeconds = parseStartSeconds(u.searchParams.get("t") || u.searchParams.get("start"));
            return { videoId, startSeconds };
          }
          if (u.hostname === "www.youtube.com" || u.hostname === "youtube.com") {
            if (u.pathname === "/watch") {
              const videoId = u.searchParams.get("v");
              if (!videoId) return null;
              const startSeconds = parseStartSeconds(u.searchParams.get("t") || u.searchParams.get("start"));
              return { videoId, startSeconds };
            }
            if (u.pathname.startsWith("/embed/")) {
              const videoId = u.pathname.split("/")[2];
              if (!videoId) return null;
              const startSeconds = parseStartSeconds(u.searchParams.get("start") || u.searchParams.get("t"));
              return { videoId, startSeconds };
            }
          }
          return null;
        } catch {
          return null;
        }
      }

      function parseStartSeconds(raw) {
        if (!raw) return 0;
        const s = String(raw).trim();
        if (!s) return 0;
        // Common formats: "101", "1m41s", "2h3m4s"
        if (/^\d+$/.test(s)) return Number(s) || 0;
        let total = 0;
        const m = s.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
        if (!m) return 0;
        const h = Number(m[1] || 0);
        const min = Number(m[2] || 0);
        const sec = Number(m[3] || 0);
        total = h * 3600 + min * 60 + sec;
        return total || 0;
      }

      function decorateHeroicMarkers(root) {
        // Mark lines that start with Heroic, or contain a parenthetical Heroic note.
        // Example: "(Heroic: 50 corruption)"
        const heroicPrefix = /^\s*heroic\b\s*[:\-]?|\(\s*heroic\b\s*[:\-]?/i;
        const candidates = Array.from(root.querySelectorAll("h3, h4, h5, h6, li, p"));

        for (const el of candidates) {
          if (el.classList.contains("heroic-marker")) continue;
          const text = (el.textContent || "").trim();
          if (!heroicPrefix.test(text)) continue;

          uppercaseHeroicPrefix(el);
          prependSkull(el);
          el.classList.add("heroic-marker");
        }
      }

      function uppercaseHeroicPrefix(el) {
        // Uppercase the first "Heroic" marker in the first meaningful text node.
        // Supported patterns:
        // - "Heroic: ..." at line start
        // - "(... (Heroic: ...) ...)" parenthetical note
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        let node = walker.nextNode();
        while (node) {
          const value = node.nodeValue || "";
          if (!value.trim()) {
            node = walker.nextNode();
            continue;
          }
          if (/^\s*heroic\b/i.test(value)) node.nodeValue = value.replace(/^(\s*)heroic\b/i, "$1HEROIC");
          else if (/\(\s*heroic\b/i.test(value)) node.nodeValue = value.replace(/\(\s*heroic\b/i, (m) => m.replace(/heroic\b/i, "HEROIC"));
          return;
        }
      }

      function prependSkull(el) {
        if (el.querySelector(":scope > .heroic-skull")) return;
        const skull = document.createElement("span");
        skull.className = "heroic-skull";
        skull.setAttribute("aria-hidden", "true");
        skull.textContent = "☠";

        // Use a plain text space after the skull for consistent wrapping.
        el.insertBefore(document.createTextNode(" "), el.firstChild);
        el.insertBefore(skull, el.firstChild);
      }

      loadVersion();
      load();
    </script>
  </body>
</html>
